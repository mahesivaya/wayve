name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rwayve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports:
          - 1025:1025
          - 8025:8025

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rwayve_test
      JWT_SECRET: ci-secret
      AES_KEY: 0123456789abcdef0123456789abcdef
      MAILHOG_API: http://localhost:8025
      MAILHOG_SMTP_HOST: localhost
      MAILHOG_SMTP_PORT: "1025"
      RUST_BACKTRACE: 1

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Apply schema
        run: psql "$DATABASE_URL" -f infra/postgres/init.sql
        env:
          PGPASSWORD: postgres

      - name: cargo test
        working-directory: backend
        run: cargo test --no-fail-fast -- --test-threads=1

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: type-check
        run: npx tsc --noEmit

      - name: vitest
        run: npm test

  docker-smoke:
    runs-on: ubuntu-latest
    # Smoke depends on the unit/integration suites passing first.
    needs: [backend-tests, frontend-tests]
    env:
      COMPOSE_FILE: infra/docker-compose.yml

    steps:
      - uses: actions/checkout@v4

      # Set up the stack via the shared composite action. env-files are
      # auto-populated from .example templates, stack comes up under
      # KEEP_RUNNING=1 so we can run probes against it afterwards.
      - name: Set up Docker stack
        uses: ./.github/actions/setup-docker-stack

      # Each probe is its own step so the GHA UI shows per-check timing
      # and `failure()` annotations point at the exact failing probe.
      # Probes mirror what scripts/smoke.sh already runs internally;
      # they're cheap and act as a second-line check on top of the
      # in-script verification.
      - name: Probe /api/health (liveness)
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/health)
          test "$status" = "200" || { echo "::error::expected 200, got $status"; exit 1; }

      - name: Probe /api/ready (readiness — Postgres + Redis reachable)
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/ready)
          test "$status" = "200" || { echo "::error::expected 200, got $status"; exit 1; }

      - name: Probe /api/me without token returns 401
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/me)
          test "$status" = "401" || { echo "::error::expected 401, got $status"; exit 1; }

      - name: Probe /api/login with bad creds returns 401
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            --data '{"email":"nobody@nowhere.test","password":"x"}' \
            http://localhost:8080/api/login)
          test "$status" = "401" || { echo "::error::expected 401, got $status"; exit 1; }

      - name: Probe / served by nginx
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/)
          [[ "$status" =~ ^(200|301|302)$ ]] || { echo "::error::expected 2xx/3xx, got $status"; exit 1; }

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f "$COMPOSE_FILE" logs --tail=200 || true

      - name: Tear down stack
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down --volumes --remove-orphans || true
