name: e2e

# Real browser drives the full docker-compose stack — the only test layer
# that exercises the auth → JWT → ProtectedRoute → backend boundary
# end-to-end. Runs on PRs and version tags; not on every push to main or on
# cron (the docker stack-up cost is real, and PR coverage is the high-value
# place for E2E).
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    # Cap the whole job — a wedged docker stack would otherwise burn an hour.
    timeout-minutes: 25
    env:
      COMPOSE_FILE: infra/docker-compose.yml

    steps:
      - uses: actions/checkout@v4

      # ---- 1 · Stack-up (env files + compose up + wait for /api/ready).
      # Single composite action — same setup as smoke and security DAST.
      - name: Set up Docker stack
        uses: ./.github/actions/setup-docker-stack

      # ---- 2 · Node + Playwright preparation. Cache npm + the browser
      # binary (~300MB) so warm runs skip the 1-2 min download.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2etest/package-lock.json

      - name: Install npm deps (deterministic via package-lock.json)
        working-directory: e2etest
        run: npm ci

      - name: Resolve Playwright version for cache key
        id: pw
        working-directory: e2etest
        run: |
          # Match the cache key to the *resolved* Playwright version, not
          # the range in package.json, so a minor bump invalidates the
          # cache.
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers (cold cache)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: e2etest
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (warm cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: e2etest
        run: npx playwright install-deps chromium

      # ---- 3 · Run the suite. Base URL points at the nginx-fronted
      # frontend brought up by the composite action above.
      - name: Run Playwright tests
        working-directory: e2etest
        env:
          E2E_BASE_URL: http://localhost:80
          CI: "true"
        run: npx playwright test

      # ---- 4 · Artifacts: HTML report (always) + raw test-results
      # (on failure). The report is what an engineer opens to triage a
      # red build.
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2etest/playwright-report/
          retention-days: 14

      - name: Upload Playwright traces & videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: e2etest/test-results/
          retention-days: 14

      # ---- 5 · Debug aid + teardown.
      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f "$COMPOSE_FILE" logs --tail=200 || true

      - name: Tear down stack
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down -v --remove-orphans || true
