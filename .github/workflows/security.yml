name: security

# One consolidated security pipeline. Stages run sequentially via `needs:`
# so the run reads top-to-bottom like a single ordered pipeline. A failure
# in any stage short-circuits the rest — cheaper checks intentionally come
# first (gitleaks, advisories) so we fail fast before paying for image
# builds and DAST.
#
# Stage order:
#   1.  secret-scan      gitleaks on full history
#   2.  deps-rust        cargo audit + cargo deny
#   3.  deps-frontend    npm audit
#   4.  sast             semgrep auto-rules + owasp-top-ten
#   5.  sbom             syft CycloneDX SBOMs (backend + frontend)
#   6.  trivy-fs         filesystem CVE scan (Rust/npm lockfiles + Docker)
#   7.  build-images     docker buildx for backend + frontend
#   8.  trivy-image      OS-layer CVE scan on the built images
#   9.  dast             stack-up → OWASP ZAP baseline → TLS/headers →
#                        Schemathesis auth fuzz → teardown (one job because
#                        the docker stack only lives within a single runner)
#   10. summary          aggregate to the GitHub job summary
#
# Triggers:
#   - PR and push to main: full pipeline
#   - Mondays 06:00 UTC: cron, catches new advisories on unchanged deps
#   - Manual: workflow_dispatch
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Cancel an in-flight run if the same ref pushes again.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # SARIF uploads (trivy, semgrep)
  actions: read

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 1. SECRET SCAN — gitleaks on full history. Cheapest gate, runs first.
  # ─────────────────────────────────────────────────────────────────────
  secret-scan:
    name: 1 · Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks sees every commit

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="8.21.2"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: gitleaks detect
        run: gitleaks detect --source . --no-banner --redact --verbose

  # ─────────────────────────────────────────────────────────────────────
  # 2. RUST SUPPLY CHAIN — cargo audit + cargo deny.
  #    Ignores live in backend/.cargo/audit.toml and backend/deny.toml so
  #    the workflow stays terse and the reasoning is co-located with
  #    the code it justifies.
  # ─────────────────────────────────────────────────────────────────────
  deps-rust:
    name: 2 · Rust deps (audit + deny)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-all-crates: true

      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install --locked cargo-audit || true
          cargo install --locked cargo-deny || true

      - name: cargo audit
        working-directory: backend
        # Honors backend/.cargo/audit.toml ignore list.
        run: cargo audit --deny warnings

      - name: cargo deny check
        working-directory: backend
        run: cargo deny check

  # ─────────────────────────────────────────────────────────────────────
  # 3. FRONTEND SUPPLY CHAIN — npm audit. Gates on high+critical only.
  # ─────────────────────────────────────────────────────────────────────
  deps-frontend:
    name: 3 · Frontend deps (npm audit)
    runs-on: ubuntu-latest
    needs: deps-rust
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: npm audit (high & critical)
        run: npm audit --audit-level=high

  # ─────────────────────────────────────────────────────────────────────
  # 4. SAST — Semgrep auto-rules + OWASP Top Ten. Runs over Rust + TS.
  #    Findings go to GitHub Code Scanning so the team can triage in the
  #    Security tab.
  # ─────────────────────────────────────────────────────────────────────
  sast:
    name: 4 · SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: deps-frontend
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4

      - name: semgrep ci
        # `--config auto` pulls Semgrep's curated baseline + language packs.
        # OWASP top-ten is layered on explicitly so a noisy auto-rule
        # change can't drop OWASP coverage silently.
        run: |
          semgrep ci \
            --config auto \
            --config p/owasp-top-ten \
            --sarif \
            --output semgrep.sarif || true
          # `|| true` keeps SARIF upload reachable; we still fail the job
          # below if any high-severity finding is present.

      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Fail on high-severity findings
        run: |
          high=$(jq '[.runs[].results[] | select(.level == "error")] | length' semgrep.sarif)
          echo "high-severity findings: $high"
          test "$high" -eq 0

  # ─────────────────────────────────────────────────────────────────────
  # 5. SBOM — Syft generates CycloneDX SBOMs for backend (workspace) and
  #    frontend (npm). Artifacts attach to the run so compliance / audit
  #    can pull them without re-running tools locally.
  # ─────────────────────────────────────────────────────────────────────
  sbom:
    name: 5 · SBOM (Syft)
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM (backend)
        uses: anchore/sbom-action@v0
        with:
          path: backend
          format: cyclonedx-json
          artifact-name: sbom-backend.cdx.json
          upload-artifact: true

      - name: Generate SBOM (frontend)
        uses: anchore/sbom-action@v0
        with:
          path: frontend
          format: cyclonedx-json
          artifact-name: sbom-frontend.cdx.json
          upload-artifact: true

  # ─────────────────────────────────────────────────────────────────────
  # 6. TRIVY FILESYSTEM — picks up vulnerable system packages referenced
  #    by Dockerfiles and lockfile findings Trivy can spot before we even
  #    build the images.
  # ─────────────────────────────────────────────────────────────────────
  trivy-fs:
    name: 6 · Trivy filesystem
    runs-on: ubuntu-latest
    needs: sbom
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-fs.sarif

      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ─────────────────────────────────────────────────────────────────────
  # 7. BUILD IMAGES — produce backend + frontend images. Cached via
  #    GitHub Actions cache so warm runs are minutes, not tens of minutes.
  # ─────────────────────────────────────────────────────────────────────
  build-images:
    name: 7 · Build images
    runs-on: ubuntu-latest
    needs: trivy-fs
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile.prod
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: rwayve-${{ matrix.name }}:scan
          outputs: type=docker,dest=/tmp/rwayve-${{ matrix.name }}.tar
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Upload image tarball
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: /tmp/rwayve-${{ matrix.name }}.tar
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────
  # 8. TRIVY IMAGE — OS-layer CVE scan on the images built in stage 7.
  # ─────────────────────────────────────────────────────────────────────
  trivy-image:
    name: 8 · Trivy image
    runs-on: ubuntu-latest
    needs: build-images
    strategy:
      fail-fast: false
      matrix:
        name: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Download image tarball
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/rwayve-${{ matrix.name }}.tar

      - name: Trivy image scan (${{ matrix.name }})
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rwayve-${{ matrix.name }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-image-${{ matrix.name }}.sarif

      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-${{ matrix.name }}.sarif
          category: trivy-image-${{ matrix.name }}

  # ─────────────────────────────────────────────────────────────────────
  # 9. DAST — Dynamic scans against a live stack. One job because the
  #    docker stack is bound to a single runner: bring it up, run all
  #    dynamic checks in order, tear it down on completion.
  #
  #    Sub-steps:
  #      a. Compose up (postgres + redis + backend + frontend + nginx)
  #      b. Wait for /api/health
  #      c. OWASP ZAP baseline (passive scan, no exploitation)
  #      d. TLS / security headers check via curl
  #      e. Schemathesis auth fuzz against /api/openapi.json
  #      f. Compose down (always, even on failure)
  # ─────────────────────────────────────────────────────────────────────
  dast:
    name: 9 · DAST (ZAP + headers + Schemathesis)
    runs-on: ubuntu-latest
    needs: trivy-image
    env:
      COMPOSE_FILE: infra/docker-compose.yml
      APP_URL: http://localhost:8080
      WEB_URL: http://localhost
    steps:
      - uses: actions/checkout@v4

      - name: Materialize CI env files
        # The smoke script already writes throwaway .env values for CI.
        # We reuse that here so this workflow and smoke.yml don't drift.
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=rwayve
          POSTGRES_PASSWORD=rwayve_password
          POSTGRES_DB=rwayve_test
          POSTGRES_PORT=5432
          EOF
          cat > backend/.env <<'EOF'
          ENV=ci
          PORT=8080
          FRONTEND_URL=http://localhost
          DATABASE_URL=postgres://rwayve:rwayve_password@postgres:5432/rwayve_test
          REDIS_URL=redis://redis:6379
          JWT_SECRET=ci-jwt-secret
          AES_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          EOF

      - name: Bring stack up
        run: docker compose -f "$COMPOSE_FILE" up -d --build

      - name: Wait for backend health
        run: |
          set -e
          for i in $(seq 1 60); do
            if curl -fs "$APP_URL/api/health" >/dev/null; then
              echo "backend healthy after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "backend never became healthy"
          docker compose -f "$COMPOSE_FILE" logs --tail=200 backend
          exit 1

      # 9a. OWASP ZAP baseline — passive scan, follows links from /,
      # checks for common misconfigurations (missing headers, cookie
      # flags, info disclosure). `cmd_options: -I` ignores warnings so
      # the job only fails on confirmed alerts.
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.13.0
        with:
          target: ${{ env.WEB_URL }}
          cmd_options: "-I -j -a"
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline

      # 9b. Security headers — quick curl check on the public surface.
      # Fail-fast on the load-bearing headers, warn-only on the rest.
      - name: Security headers
        run: |
          set -e
          required=(content-security-policy x-content-type-options x-frame-options referrer-policy)
          headers=$(curl -sI "$WEB_URL/" | tr '[:upper:]' '[:lower:]')
          echo "--- response headers ---"; echo "$headers"
          missing=0
          for h in "${required[@]}"; do
            if ! grep -q "^$h:" <<<"$headers"; then
              echo "::error::missing required header: $h"
              missing=$((missing+1))
            fi
          done
          test "$missing" -eq 0

      # 9c. Schemathesis — generates payloads against every endpoint in
      # the OpenAPI spec and verifies the server doesn't 5xx, leak data,
      # or accept requests it should reject. Checks `--checks all`
      # catches auth bypass on protected routes.
      - name: Schemathesis auth fuzz
        run: |
          pip install --quiet schemathesis
          schemathesis run \
            --base-url "$APP_URL" \
            --checks all \
            --hypothesis-max-examples 30 \
            --hypothesis-deadline 5000 \
            "$APP_URL/api/openapi.json"

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose -f "$COMPOSE_FILE" logs --tail=400 backend

      - name: Tear stack down
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down --volumes --remove-orphans

  # ─────────────────────────────────────────────────────────────────────
  # 10. SUMMARY — aggregate stage outcomes to the GitHub run summary so
  #     the reviewer sees a single dashboard per run.
  # ─────────────────────────────────────────────────────────────────────
  summary:
    name: 10 · Summary
    runs-on: ubuntu-latest
    # All stage IDs are listed so `needs.<id>.result` resolves below.
    # `if: always()` ensures the summary still publishes when an earlier
    # stage failed (and downstream stages were skipped).
    needs:
      - secret-scan
      - deps-rust
      - deps-frontend
      - sast
      - sbom
      - trivy-fs
      - build-images
      - trivy-image
      - dast
    if: always()
    steps:
      - name: Write summary
        run: |
          {
            echo "# Security pipeline"
            echo
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| 1 · Secret scan | ${{ needs.secret-scan.result || '—' }} |"
            echo "| 2 · Rust deps | ${{ needs.deps-rust.result || '—' }} |"
            echo "| 3 · Frontend deps | ${{ needs.deps-frontend.result || '—' }} |"
            echo "| 4 · SAST | ${{ needs.sast.result || '—' }} |"
            echo "| 5 · SBOM | ${{ needs.sbom.result || '—' }} |"
            echo "| 6 · Trivy fs | ${{ needs.trivy-fs.result || '—' }} |"
            echo "| 7 · Build images | ${{ needs.build-images.result || '—' }} |"
            echo "| 8 · Trivy image | ${{ needs.trivy-image.result || '—' }} |"
            echo "| 9 · DAST | ${{ needs.dast.result || '—' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
