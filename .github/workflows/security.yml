name: security

# One consolidated security pipeline. Gates run in parallel except where
# a real data dependency forces ordering, so the GHA graph fits on one
# screen (3 columns wide) and the wall-clock runtime is bounded by the
# slowest single gate (build-images ~4 min) rather than the sum of all
# of them. Each numbered job is its own independent check — its name
# encodes the *category*, not the *order* it ran in.
#
# Dependency DAG:
#   secret-scan ─┐
#   deps-rust ───┤
#   deps-frontend┤
#   sast ────────┤────────────────────────────────────────→ summary
#   sbom ────────┤
#   trivy-fs ────┤
#   build-images ┴─→ trivy-image ───────────────────────────→ ↑
#   dast ──────────────────────────────────────────────────→ ┘
#
# The only "real" needs: declarations are:
#   trivy-image → build-images   (consumes the image tarball artifact)
#   summary     → [every other]  (reads each job's .result for the table)
#
# Trade-off vs sequential: we lose fail-fast (a failing secret-scan
# won't stop the slow build-images), but the cheap checks finish in
# seconds anyway — worst-case extra spend is ~30s of wasted runner time.
# In exchange the pipeline runs in ~5-6 min instead of ~13 min and the
# graph is readable without scrolling.
#
# Triggers:
#   - PR and push to main: full pipeline
#   - Mondays 06:00 UTC: cron, catches new advisories on unchanged deps
#   - Manual: workflow_dispatch
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Cancel an in-flight run if the same ref pushes again.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # SARIF uploads (trivy, semgrep)
  actions: read

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 1. SECRET SCAN — gitleaks on full history. Cheapest gate, runs first.
  # ─────────────────────────────────────────────────────────────────────
  secret-scan:
    name: 1 · Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks sees every commit

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="8.21.2"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: gitleaks detect
        run: gitleaks detect --source . --no-banner --redact --verbose

  # ─────────────────────────────────────────────────────────────────────
  # 2. RUST SUPPLY CHAIN — cargo audit + cargo deny.
  #    Ignores live in backend/.cargo/audit.toml and backend/deny.toml so
  #    the workflow stays terse and the reasoning is co-located with
  #    the code it justifies.
  # ─────────────────────────────────────────────────────────────────────
  deps-rust:
    name: 2 · Rust deps (audit + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-all-crates: true

      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install --locked cargo-audit || true
          cargo install --locked cargo-deny || true

      - name: cargo audit
        working-directory: backend
        # Honors backend/.cargo/audit.toml ignore list.
        run: cargo audit --deny warnings

      - name: cargo deny check
        working-directory: backend
        run: cargo deny check

  # ─────────────────────────────────────────────────────────────────────
  # 3. FRONTEND SUPPLY CHAIN — npm audit. Gates on high+critical only.
  # ─────────────────────────────────────────────────────────────────────
  deps-frontend:
    name: 3 · Frontend deps (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: npm audit (high & critical)
        run: npm audit --audit-level=high

  # ─────────────────────────────────────────────────────────────────────
  # 4. SAST — Semgrep auto-rules + OWASP Top Ten. Runs over Rust + TS.
  #    Findings go to GitHub Code Scanning so the team can triage in the
  #    Security tab.
  # ─────────────────────────────────────────────────────────────────────
  sast:
    name: 4 · SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4

      - name: semgrep ci
        # `--config auto` pulls Semgrep's curated baseline + language packs.
        # OWASP top-ten is layered on explicitly so a noisy auto-rule
        # change can't drop OWASP coverage silently.
        run: |
          semgrep ci \
            --config auto \
            --config p/owasp-top-ten \
            --sarif \
            --output semgrep.sarif || true
          # `|| true` keeps SARIF upload reachable; we still fail the job
          # below if any high-severity finding is present.

      - name: Upload SARIF to GitHub code scanning
        if: always()
        # Uploading SARIF to GitHub code scanning requires GitHub Advanced
        # Security, which isn't available on this (now private) repo — so the
        # upload 403s. Don't fail the security pipeline on it; the scan results
        # are still produced and the high-severity gate below still runs.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Fail on high-severity findings
        run: |
          high=$(jq '[.runs[].results[] | select(.level == "error")] | length' semgrep.sarif)
          echo "high-severity findings: $high"
          test "$high" -eq 0

  # ─────────────────────────────────────────────────────────────────────
  # 5. SBOM — Syft generates CycloneDX SBOMs for backend (workspace) and
  #    frontend (npm). Artifacts attach to the run so compliance / audit
  #    can pull them without re-running tools locally.
  # ─────────────────────────────────────────────────────────────────────
  sbom:
    name: 5 · SBOM (Syft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM (backend)
        uses: anchore/sbom-action@v0
        with:
          path: backend
          format: cyclonedx-json
          artifact-name: sbom-backend.cdx.json
          upload-artifact: true

      - name: Generate SBOM (frontend)
        uses: anchore/sbom-action@v0
        with:
          path: frontend
          format: cyclonedx-json
          artifact-name: sbom-frontend.cdx.json
          upload-artifact: true

  # ─────────────────────────────────────────────────────────────────────
  # 6. TRIVY FILESYSTEM — picks up vulnerable system packages referenced
  #    by Dockerfiles and lockfile findings Trivy can spot before we even
  #    build the images.
  # ─────────────────────────────────────────────────────────────────────
  trivy-fs:
    name: 6 · Trivy filesystem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-fs.sarif
          # Without this, the action unsets TRIVY_SEVERITY when format=sarif
          # and the exit-code gate fires on ANY severity (including MEDIUM).
          # We want the gate to honor the `severity` filter declared above
          # so MEDIUM-only findings still land in Code Scanning for triage
          # but don't fail the build. cargo-audit / npm-audit catch the
          # MEDIUM Rust + npm dep issues with their own gating.
          limit-severities-for-sarif: true

      - name: Upload SARIF to GitHub code scanning
        if: always()
        # Uploading SARIF to GitHub code scanning requires GitHub Advanced
        # Security, which isn't available on this (now private) repo — so the
        # upload 403s. Don't fail the security pipeline on it; the scan results
        # are still produced and the high-severity gate below still runs.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ─────────────────────────────────────────────────────────────────────
  # 7. BUILD IMAGES — produce backend + frontend images. Cached via
  #    GitHub Actions cache so warm runs are minutes, not tens of minutes.
  # ─────────────────────────────────────────────────────────────────────
  build-images:
    name: 7 · Build images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile.prod
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: rwayve-${{ matrix.name }}:scan
          outputs: type=docker,dest=/tmp/rwayve-${{ matrix.name }}.tar
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Upload image tarball
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: /tmp/rwayve-${{ matrix.name }}.tar
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────
  # 8. TRIVY IMAGE — OS-layer CVE scan on the images built in stage 7.
  # ─────────────────────────────────────────────────────────────────────
  trivy-image:
    name: 8 · Trivy image
    runs-on: ubuntu-latest
    needs: build-images
    strategy:
      fail-fast: false
      matrix:
        name: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Download image tarball
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/rwayve-${{ matrix.name }}.tar

      - name: Trivy image scan (${{ matrix.name }})
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rwayve-${{ matrix.name }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-image-${{ matrix.name }}.sarif
          # See trivy-fs above for the explanation — without this flag
          # the SARIF mode strips the severity filter and exit-code 1
          # fires on any finding.
          limit-severities-for-sarif: true

      - name: Upload SARIF to GitHub code scanning
        if: always()
        # Uploading SARIF to GitHub code scanning requires GitHub Advanced
        # Security, which isn't available on this (now private) repo — so the
        # upload 403s. Don't fail the security pipeline on it; the scan results
        # are still produced and the high-severity gate below still runs.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-${{ matrix.name }}.sarif
          category: trivy-image-${{ matrix.name }}

  # ─────────────────────────────────────────────────────────────────────
  # 9. DAST — Dynamic scans against a live stack. One job because the
  #    docker stack is bound to a single runner: bring it up, run all
  #    dynamic checks in order, tear it down on completion.
  #
  #    Sub-steps:
  #      a. Compose up (postgres + redis + backend + frontend + nginx)
  #      b. Wait for /api/health
  #      c. OWASP ZAP baseline (passive scan, no exploitation)
  #      d. TLS / security headers check via curl
  #      e. Schemathesis auth fuzz against /api/openapi.json
  #      f. Compose down (always, even on failure)
  # ─────────────────────────────────────────────────────────────────────
  dast:
    name: 9 · DAST (ZAP + headers + Schemathesis)
    runs-on: ubuntu-latest
    # No `needs:` — dast brings up its own compose stack via the
    # setup-docker-stack composite action, so it doesn't actually
    # consume any artifact from build-images / trivy-image. Running
    # it in parallel with the other gates cuts ~9 min off the
    # wall-clock pipeline runtime.
    env:
      COMPOSE_FILE: infra/docker-compose.yml
      APP_URL: http://localhost:8080
      WEB_URL: http://localhost
    steps:
      - uses: actions/checkout@v4

      # Shared composite action — env-files + compose up + wait-healthy.
      # Same setup used by smoke.yml and e2e.yml so the stack-up logic
      # lives in exactly one place (.github/actions/setup-docker-stack).
      - name: Set up Docker stack
        uses: ./.github/actions/setup-docker-stack

      # 9a. OWASP ZAP baseline — passive scan, follows links from /,
      # checks for common misconfigurations (missing headers, cookie
      # flags, info disclosure).
      #
      # Report-only: `fail_action: false` keeps the job green when ZAP
      # raises baseline warnings. The findings still upload as an
      # artifact (zap-baseline) and rule-tsv overrides go in
      # .zap/rules.tsv if/when we want to gate on specific rules.
      # Rationale: passive baseline findings (Storable Cacheable
      # Content, Modern Web Application, Sec-Fetch-Dest missing, base64
      # disclosure, etc.) generate too many "hardening hints" to gate
      # CI on without crystallising into noise. The SAST + Trivy + cargo
      # audit stages above are the load-bearing gates; this stage is
      # exploratory.
      - name: OWASP ZAP baseline scan
        # continue-on-error swallows the action's broken artifact-upload
        # step. The v0.13.0 action hard-wires a `Create Artifact
        # Container` call against the v6.0-preview API which Azure
        # Pipelines has decommissioned, so the upload errors after a
        # successful scan no matter what `artifact_name` we pass
        # (empty string just falls back to the default `zap_scan`).
        # The scan's PASS/WARN/FAIL summary is already in the job log
        # for triage; ZAP itself reported FAIL-NEW: 0 on the last run.
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.13.0
        with:
          target: ${{ env.WEB_URL }}
          cmd_options: "-I -j -a"
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline

      # 9b. Security headers — quick curl check on the public surface.
      # Fail-fast on the load-bearing headers, warn-only on the rest.
      - name: Security headers
        run: |
          set -e
          required=(content-security-policy x-content-type-options x-frame-options referrer-policy)
          headers=$(curl -sI "$WEB_URL/" | tr '[:upper:]' '[:lower:]')
          echo "--- response headers ---"; echo "$headers"
          missing=0
          for h in "${required[@]}"; do
            if ! grep -q "^$h:" <<<"$headers"; then
              echo "::error::missing required header: $h"
              missing=$((missing+1))
            fi
          done
          test "$missing" -eq 0

      # 9c. Schemathesis — generates payloads against every endpoint in
      # the OpenAPI spec and verifies the server doesn't 5xx, leak data,
      # or accept requests it should reject. Reports-only for now —
      # property-based fuzz against the full /api surface is the noisy
      # end of DAST (lots of "your error response shape isn't documented
      # in the OpenAPI schema" warnings that don't correspond to real
      # vulns). Output captured for triage; gating happens elsewhere.
      - name: Schemathesis auth fuzz
        continue-on-error: true
        run: |
          pip install --quiet schemathesis
          schemathesis run \
            --base-url "$APP_URL" \
            --checks all \
            --hypothesis-max-examples 30 \
            --hypothesis-deadline 5000 \
            "$APP_URL/api/openapi.json" || echo "::warning::Schemathesis reported findings — see job log; not blocking CI"

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose -f "$COMPOSE_FILE" logs --tail=400 backend

      - name: Tear stack down
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down --volumes --remove-orphans

  # ─────────────────────────────────────────────────────────────────────
  # 10. SUMMARY — aggregate stage outcomes to the GitHub run summary so
  #     the reviewer sees a single dashboard per run.
  # ─────────────────────────────────────────────────────────────────────
  summary:
    name: 10 · Summary
    runs-on: ubuntu-latest
    # All stage IDs are listed so `needs.<id>.result` resolves below.
    # `if: always()` ensures the summary still publishes when an earlier
    # stage failed (and downstream stages were skipped).
    needs:
      - secret-scan
      - deps-rust
      - deps-frontend
      - sast
      - sbom
      - trivy-fs
      - build-images
      - trivy-image
      - dast
    if: always()
    steps:
      - name: Write summary
        run: |
          {
            echo "# Security pipeline"
            echo
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| 1 · Secret scan | ${{ needs.secret-scan.result || '—' }} |"
            echo "| 2 · Rust deps | ${{ needs.deps-rust.result || '—' }} |"
            echo "| 3 · Frontend deps | ${{ needs.deps-frontend.result || '—' }} |"
            echo "| 4 · SAST | ${{ needs.sast.result || '—' }} |"
            echo "| 5 · SBOM | ${{ needs.sbom.result || '—' }} |"
            echo "| 6 · Trivy fs | ${{ needs.trivy-fs.result || '—' }} |"
            echo "| 7 · Build images | ${{ needs.build-images.result || '—' }} |"
            echo "| 8 · Trivy image | ${{ needs.trivy-image.result || '—' }} |"
            echo "| 9 · DAST | ${{ needs.dast.result || '—' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
