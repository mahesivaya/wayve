name: security

# Runs on every PR / push to main, and on a weekly cron so a brand-new
# advisory for an unchanged dependency still pages someone. Jobs run in
# parallel — each one is the single source of truth for its slice of the
# supply chain.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:00 UTC. The point is to catch advisories filed against
    # code that hasn't been touched recently.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Cancel an in-flight run if the same ref pushes again — saves minutes on
# rapid-fire PR updates without losing signal (the latest commit still runs).
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write  # for uploading SARIF (trivy)

jobs:
  # 🦀 Rust supply chain — RustSec advisory DB. Catches CVEs in jsonwebtoken,
  # aes-gcm, lettre, redis, etc. before they reach prod.
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          # cargo-audit lives in ~/.cargo/bin; let the action cache it.
          cache-all-crates: true

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit || true

      - name: cargo audit
        working-directory: backend
        # --deny warnings turns informational advisories into failures too —
        # appropriate for a security-sensitive service. Drop to --deny vulnerabilities
        # if the noise floor gets too high.
        run: cargo audit --deny warnings

  # 📦 Frontend supply chain — npm audit. The --audit-level=high gate matches
  # what most enterprises consider blocking; moderate findings are tracked but
  # do not fail the build.
  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: npm audit (high & critical)
        run: npm audit --audit-level=high

  # 🔑 Secret scanning — runs gitleaks against the full history on PRs and
  # against the new commits on push. Catches an accidentally-committed AES_KEY,
  # JWT_SECRET, Stripe key, or Google client_secret.json before it lands in
  # main where it would need rotation (and AES_HKDF_SALT can't be rotated).
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan all commits, not just HEAD.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="8.21.2"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: gitleaks detect
        run: gitleaks detect --source . --no-banner --redact --verbose

  # 🐳 Container & filesystem CVE scan — Trivy. The fs scan picks up the Rust
  # and npm lockfiles AND any vulnerable system packages referenced in the
  # Dockerfiles. We gate on HIGH/CRITICAL and ignore unfixed advisories
  # (there's nothing to patch).
  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-fs.sarif

      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # 🐳 Image scan — build each service image once and let Trivy inspect the
  # OS layer for CVEs the fs scan can't see. Runs after fs to fail fast on the
  # cheaper check.
  trivy-image:
    runs-on: ubuntu-latest
    needs: trivy-fs
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile.prod
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: rwayve-${{ matrix.name }}:scan
          # Buildx layer cache via GitHub Actions cache — keeps image scans
          # under a couple of minutes on warm runs.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Trivy image scan (${{ matrix.name }})
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rwayve-${{ matrix.name }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-image-${{ matrix.name }}.sarif

      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-${{ matrix.name }}.sarif
          category: trivy-image-${{ matrix.name }}
