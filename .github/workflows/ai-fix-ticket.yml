name: AI Fix Ticket

# Phase 2 of the ticket pipeline: Claude Code implements a fix for a Workspace
# ticket and opens a PR. Dispatched on demand by the backend
# (POST /api/workspace-tickets/{id}/ai-fix) or manually from the Actions tab.
#
# Setup (one-time):
#   - Add the `ANTHROPIC_API_KEY` repository secret (Settings → Secrets → Actions).
#   - This file must live on the default branch for workflow_dispatch to work.
# The agent self-verifies (fmt/clippy/build/tsc/vitest via the fix-ticket skill);
# the opened PR then re-runs the full CI (smoke.yml) as the enforced gate.

on:
  workflow_dispatch:
    inputs:
      ticket_number:
        description: "Workspace ticket id"
        required: true
      ticket_title:
        description: "Ticket title"
        required: true
      ticket_description:
        description: "Ticket description"
        required: true
      past_fix_summary:
        description: "Summary of how a similar ticket was fixed (optional)"
        required: false
        default: ""
      past_fix_commit:
        description: "Commit SHA of that past fix (optional)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The agent runs the repo's verify commands, so it needs the toolchains.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Create fix branch
        run: git checkout -b "ai-fix/ticket-${{ github.event.inputs.ticket_number }}-${{ github.run_id }}"

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Use the /fix-ticket skill to implement and verify a fix for this ticket.

            Ticket #${{ github.event.inputs.ticket_number }}: ${{ github.event.inputs.ticket_title }}

            Description:
            ${{ github.event.inputs.ticket_description }}

            Similar past fix (may be empty — if present, read this commit's diff as a guide):
            summary: ${{ github.event.inputs.past_fix_summary }}
            commit: ${{ github.event.inputs.past_fix_commit }}
          claude_args: |
            --max-turns 20
            --model claude-sonnet-5

      - name: Open pull request
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="ai-fix/ticket-${{ github.event.inputs.ticket_number }}-${{ github.run_id }}"
          # Only open a PR if the agent actually committed a change.
          if git diff --quiet "origin/${GITHUB_REF_NAME}" -- 2>/dev/null && [ -z "$(git log origin/${GITHUB_REF_NAME}..HEAD --oneline 2>/dev/null)" ]; then
            echo "No changes were committed by the agent; skipping PR."
            exit 0
          fi
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "fix(ticket): #${{ github.event.inputs.ticket_number }} ${{ github.event.inputs.ticket_title }}" \
            --body "Automated fix for Workspace ticket #${{ github.event.inputs.ticket_number }}.

          ${{ github.event.inputs.ticket_description }}

          🤖 Generated by the AI-fix pipeline (Claude Code). CI must pass before merge."
