name: AI Fix Ticket

# Phase 2 of the ticket pipeline: Claude Code implements a fix for a Workspace
# ticket, pushes a fix branch, and posts its diff back to the ticket for in-app
# review. It does NOT open a PR — the owner reviews the diff on the ticket page
# and clicks "Commit & push", which opens the PR from the pushed branch (backend
# POST /api/workspace-tickets/{id}/ai-fix-open-pr). Dispatched on demand by the
# backend (POST /api/workspace-tickets/{id}/ai-fix) or manually from the Actions tab.
#
# Setup (one-time), as repository secrets:
#   - ANTHROPIC_API_KEY — for the agent.
#   - WAYVE_BASE_URL    — e.g. https://fluxze.com (to POST the diff back).
#   - WAYVE_API_KEY     — an internal API key mapped to a tickets:manage user.
#   - This file must live on the default branch for workflow_dispatch to work.
# The agent self-verifies (fmt/clippy/build/tsc/vitest via the fix-ticket skill);
# the PR opened later re-runs the full CI (smoke.yml) as the enforced gate.

on:
  workflow_dispatch:
    inputs:
      ticket_number:
        description: "Workspace ticket id"
        required: true
      ticket_title:
        description: "Ticket title"
        required: true
      ticket_description:
        description: "Ticket description"
        required: true
      past_fix_summary:
        description: "Summary of how a similar ticket was fixed (optional)"
        required: false
        default: ""
      past_fix_commit:
        description: "Commit SHA of that past fix (optional)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The agent runs the repo's verify commands, so it needs the toolchains.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Create fix branch
        run: git checkout -b "ai-fix/ticket-${{ github.event.inputs.ticket_number }}-${{ github.run_id }}"

      - name: Set commit identity
        run: |
          git config user.name "wayve-ai-fixer[bot]"
          git config user.email "ai-fixer@users.noreply.github.com"

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Use the /fix-ticket skill to implement and verify a fix for this ticket.

            Ticket #${{ github.event.inputs.ticket_number }}: ${{ github.event.inputs.ticket_title }}

            Description:
            ${{ github.event.inputs.ticket_description }}

            Similar past fix (may be empty — if present, read this commit's diff as a guide):
            summary: ${{ github.event.inputs.past_fix_summary }}
            commit: ${{ github.event.inputs.past_fix_commit }}
          claude_args: |
            --max-turns 20
            --model claude-sonnet-5

      # Push the fix branch and post its diff back to the ticket for in-app review.
      # No PR is opened here — the owner reviews the diff on the ticket page and
      # clicks "Commit & push", which opens the PR from this branch. Runs on every
      # outcome (always) so a failed/empty run still reports its status.
      - name: Report diff to ticket
        if: always()
        env:
          BASE_URL: ${{ secrets.WAYVE_BASE_URL }}
          API_KEY: ${{ secrets.WAYVE_API_KEY }}
          TICKET: ${{ github.event.inputs.ticket_number }}
          AGENT_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          set -uo pipefail
          BRANCH="ai-fix/ticket-${TICKET}-${{ github.run_id }}"
          if [ -z "${BASE_URL:-}" ] || [ -z "${API_KEY:-}" ]; then
            echo "WAYVE_BASE_URL / WAYVE_API_KEY not configured; cannot report back."
            exit 0
          fi

          post() {
            # $1 = json body
            curl -fsS -X POST "$BASE_URL/api/workspace-tickets/$TICKET/ai-fix-diff" \
              -H "X-API-KEY: $API_KEY" \
              -H "Content-Type: application/json" \
              --data "$1" || echo "callback POST failed"
          }

          COMMITS=$(git rev-list --count origin/main..HEAD 2>/dev/null || echo 0)
          if [ "$AGENT_OUTCOME" != "success" ] && [ "$COMMITS" -eq 0 ]; then
            echo "Agent did not succeed and produced no commit → error."
            post "$(jq -n '{status:"error"}')"
            exit 0
          fi
          if [ "$COMMITS" -eq 0 ]; then
            echo "No commit produced → no_change."
            post "$(jq -n '{status:"no_change"}')"
            exit 0
          fi

          git push origin "$BRANCH"
          DIFF=$(git diff origin/main...HEAD)
          BODY=$(jq -n --arg b "$BRANCH" --arg d "$DIFF" \
            '{status:"ready", branch:$b, diff:$d}')
          post "$BODY"
          echo "Reported ready diff for ticket #$TICKET on branch $BRANCH"
