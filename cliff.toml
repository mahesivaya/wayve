# git-cliff configuration — generates CHANGELOG.md from Conventional Commits.
# Grouping mirrors .github/release.yml so the in-repo CHANGELOG and GitHub's
# native Release Notes tell the same story. See CONTRIBUTING.md for commit rules.
# Usage: `just changelog` (local) or the `changelog` job in release.yml (CI on tag).

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.
This file is generated from Conventional Commits by [git-cliff](https://git-cliff.org).\n
"""
# Tera template. Commits are pre-grouped into `commits` by `group` below.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}]($REPO/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true
postprocessors = [
  { pattern = '\$REPO', replace = "https://github.com/mahesivaya/wayve" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Strip the type/scope prefix; the template re-adds scope in bold.
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/mahesivaya/wayve/issues/${2}))" },
]
# First matching parser wins. Order: breaking → feat → fix → maintenance.
# `group` strings sort by their leading <N> tag, then the visible title shows.
commit_parsers = [
  { message = "^feat", group = "<1>🚀 Features" },
  { message = "^fix", group = "<2>🐛 Bug Fixes" },
  { message = "^perf", group = "<3>🧹 Maintenance" },
  { message = "^refactor", group = "<3>🧹 Maintenance" },
  { message = "^docs", group = "<3>🧹 Maintenance" },
  { message = "^test", group = "<3>🧹 Maintenance" },
  { message = "^chore", group = "<3>🧹 Maintenance" },
  { message = "^ci", group = "<3>🧹 Maintenance" },
  { message = "^build", group = "<3>🧹 Maintenance" },
  { message = "^revert", group = "<3>🧹 Maintenance" },
  { body = ".*security", group = "<2>🐛 Bug Fixes" },
  { message = ".*", group = "<4>Other Changes" },
]
# Breaking changes (`!` or `BREAKING CHANGE:`) get bumped to the top group.
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "newest"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
