[package]
name = "wayve-security"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# Web framework — needed for HttpRequest extraction in jwt.rs and the
# Cookie helpers, plus the api_key middleware's request inspection.
actix-web.workspace = true

# password.rs hashes off the async runtime via spawn_blocking; thiserror
# is for the local PasswordError enum.
tokio.workspace = true
thiserror.workspace = true

# Database — rbac.rs and api_key.rs query Postgres for role/scope and
# audit-log writes.
sqlx.workspace = true

# Crypto primitives
aes-gcm.workspace = true
bcrypt.workspace = true
hkdf.workspace = true
sha2.workspace = true
hmac.workspace = true
jsonwebtoken.workspace = true
base64.workspace = true
rand.workspace = true
# RSA-OAEP for Plan A's inbound "encrypt-on-arrival" path: body_worker
# wraps each fetched email body to the recipient's RSA public key so the
# server never persists a copy it can decrypt. Single dep, no transitive
# weight beyond what aes-gcm + sha2 already brought in.
rsa = "0.9"

# Zero-out plaintext private-key bytes after wrapping. Used in the org-
# member provisioning path (encryption.rs::provision_org_member_keypair)
# so the keypair the server briefly held in memory doesn't linger on the
# heap past the wrap step. Best-effort — Rust's drop semantics make full
# guarantees impossible — but raises the bar significantly above bare Vec.
zeroize = { version = "1.7", features = ["zeroize_derive"] }

# PBKDF2-HMAC-SHA256 for deriving an AES-GCM wrap key from the member's
# password. 600k iters matches the personal-user mnemonic path in
# frontend/src/crypto/recovery.ts. With a per-user random salt this gives
# the same brute-force cost the personal-user mnemonic path enjoys.
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac", "sha2"] }

# Caching for API key validation
moka.workspace = true

# rbac.rs uses an async-trait object behind an OnceCell so wayve-server can
# install a Redis-backed RoleContext cache at startup.
async-trait.workspace = true

# OAuth + SSO helpers reach external providers
reqwest.workspace = true

# General-purpose
anyhow.workspace = true
chrono.workspace = true
once_cell.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
