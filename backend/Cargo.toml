[workspace]
members = ["crates/wayve-server", "crates/wayve-security", "crates/wayve-db"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

# Centralised dep versions so sub-crates can write
# `actix-web.workspace = true` instead of duplicating versions. Keep this
# in lock-step with whatever the leaf crates actually use.
[workspace.dependencies]
actix = "0.13"
actix-web = "4"
actix-web-actors = "4"
actix-cors = "0.7"
actix-multipart = "0.6"
actix-files = "0.6.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "json"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
futures = "0.3"
futures-util = "0.3"
once_cell = "1"
anyhow = "1"
thiserror = "2"
bcrypt = "0.15"
jsonwebtoken = "9"
base64 = "0.21"
aes-gcm = "0.10.3"
hmac = "0.12"
hkdf = "0.12"
sha2 = "0.10"
pbkdf2 = "0.12"
rand = { version = "0.8", features = ["std"] }
uuid = { version = "1", features = ["v4"] }
lazy_static = "1.4"
tracing = { version = "0.1.44", features = ["log-always"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tracing-actix-web = "0.7"
log = "0.4.29"
dotenvy = "0.15.7"
redis = { version = "0.25", features = ["tokio-comp"] }
lettre = { version = "0.11.22", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder"] }
moka = { version = "0.12", features = ["future"] }
mimalloc = { version = "0.1", default-features = false }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
async-trait = "0.1"
# S3 storage for user-uploaded files (drive, attachments, documents, avatars).
# Off unless S3_BUCKET is set — see storage.rs and ENVIRONMENTS.md.
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
# Offline IP geolocation (GeoLite2-City .mmdb) for the User Logs page.
maxminddb = "0.28"

# Yahoo Mail integration — Yahoo killed third-party OAuth, so we speak
# IMAP for read + SMTP (via lettre, above) for send. tokio-rustls layers
# TLS over a tokio TcpStream which we then hand to async-imap. mail-parser
# is the de-facto RFC 5322 / MIME parser in Rust; we use it to extract
# headers and body parts from FETCH responses.
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
mail-parser = "0.9"

# Release profile inherited by all workspace members. Same settings as
# the pre-workspace single crate — small binary on memory-constrained
# Docker builders, no LTO, plenty of codegen units.
[profile.release]
opt-level = 1
codegen-units = 256
lto = false
incremental = false
