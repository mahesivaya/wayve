org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The server a debug build talks to. Production by default; for the local dev
# stack from the emulator use http://10.0.2.2 (the emulator's alias for the
# Mac's localhost). Release builds always use production.
hadal.debugBaseUrl=https://hadalspace.com
