<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>

    <!--
      Editorial font pair for the marketing surfaces (`.public-home`).
      Fraunces is a free Google Fonts approximation of the Tiempos
      Headline / GT Sectra serif used on Stripe / Linear / ChatGPT
      marketing pages. Inter is the body sans those same sites pair
      with it. Scoped to `.public-home` in marketing.css so the
      authenticated app UI keeps its current sans-serif look.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      Pre-paint theme bootstrap. Runs synchronously before React mounts so
      the page never flashes. Light is the default for every visitor —
      OS dark preference is intentionally ignored. Dark mode only happens
      when the user explicitly clicks the toggle (which persists
      `wayve-theme=dark` in localStorage).
    -->
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("wayve-theme");
        } catch (e) {
          /* Storage may be blocked (Safari private mode) — that's fine,
             we just fall back to the light default. */
        }
        document.documentElement.setAttribute(
          "data-theme",
          saved === "dark" ? "dark" : "light"
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
