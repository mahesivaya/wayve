<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/fluxze.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fluxze</title>

    <!--
      Editorial font pair for the marketing surfaces (`.public-home`).
      Fraunces is a free Google Fonts approximation of the Tiempos
      Headline / GT Sectra serif used on Stripe / Linear / ChatGPT
      marketing pages. Inter is the body sans those same sites pair
      with it. Scoped to `.public-home` in marketing.css so the
      authenticated app UI keeps its current sans-serif look.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      Pre-paint theme bootstrap. Runs synchronously before React mounts so
      the page never flashes. The navy dark theme is the default for every
      visitor; light mode only happens when the user explicitly toggles it
      (which persists `wayve-theme=light` in localStorage).
    -->
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("wayve-theme");
        } catch (e) {
          /* Storage may be blocked (Safari private mode) — that's fine,
             we just fall back to the dark default. */
        }
        document.documentElement.setAttribute(
          "data-theme",
          saved === "light" ? "light" : "dark"
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
