<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <!--
      Pre-paint theme bootstrap. Runs synchronously before React mounts so
      the page never flashes. Light is the default for every visitor —
      OS dark preference is intentionally ignored. Dark mode only happens
      when the user explicitly clicks the toggle (which persists
      `wayve-theme=dark` in localStorage).
    -->
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("wayve-theme");
        } catch (e) {
          /* Storage may be blocked (Safari private mode) — that's fine,
             we just fall back to the light default. */
        }
        document.documentElement.setAttribute(
          "data-theme",
          saved === "dark" ? "dark" : "light"
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
