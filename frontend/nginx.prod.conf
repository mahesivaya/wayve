server {
    # 8080 instead of 80 — the image now uses nginx-unprivileged so the
    # worker can run as the `nginx` user. The outer nginx proxy targets
    # frontend:8080 to match.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
