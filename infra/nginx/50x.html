<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>We'll be right back</title>
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: #f8fafc;
        color: #111827;
      }
      .box {
        max-width: 440px;
        padding: 40px 32px;
        text-align: center;
      }
      .brand {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #2563eb;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 12px;
      }
      p {
        font-size: 16px;
        line-height: 1.5;
        color: #6b7280;
        margin: 0 0 24px;
      }
      button {
        padding: 10px 22px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="brand">Fluxze</div>
      <h1>We'll be right back</h1>
      <p>
        We're having trouble reaching the service right now. This is usually
        temporary — please try again in a moment.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
